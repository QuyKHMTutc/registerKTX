<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<!-- ============================================================================ -->
<!-- FRAGMENT: Common Header                                                      -->
<!-- ============================================================================ -->

<head th:fragment="header(title, description)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        th:content="${description != null ? description : 'Hệ thống quản lý ký túc xá - Quản lý phòng, đơn đăng ký, hợp đồng và hóa đơn'}">
    <meta name="keywords" content="ký túc xá, quản lý phòng, đăng ký phòng, KTX">
    <meta name="author" content="KTX Manager">
    <meta name="theme-color" content="#667eea">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" th:content="${title + ' - KTX Manager'}">
    <meta property="og:description" th:content="${description != null ? description : 'Hệ thống quản lý ký túc xá'}">

    <title th:text="${title} + ' - KTX Manager'"></title>

    <!-- Preload critical resources -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" as="style">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link th:href="@{/css/custom.css}" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">

    <!-- Performance: Preconnect to CDN -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
</head>

<body>

    <!-- Skip to main content for accessibility -->
    <a href="#main-content" class="visually-hidden-focusable btn btn-primary position-absolute top-0 start-0 m-2"
        style="z-index: 9999;">
        Bỏ qua đến nội dung chính
    </a>


    <!-- User Navbar Fragment with Offcanvas -->
    <th:block th:fragment="user-navbar">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4" role="navigation"
            aria-label="Sinh viên navigation">
            <div class="container-fluid">
                <div class="d-flex align-items-center">
                    <!-- Hamburger Button -->
                    <button class="btn text-white me-3" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#studentSidebar" aria-controls="studentSidebar" aria-label="Toggle navigation">
                        <i class="fas fa-bars fs-5"></i>
                    </button>

                    <a class="navbar-brand" th:href="@{/user/don-dang-ky/my-applications}"
                        aria-label="Trang chủ sinh viên">
                        <i class="fas fa-home me-2" aria-hidden="true"></i>Trang Sinh Viên
                    </a>
                </div>

                <!-- Student Profile Dropdown -->
                <div class="dropdown ms-3" th:if="${sinhVien != null}">
                    <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
                        data-bs-toggle="dropdown" aria-expanded="false" id="studentDropdown">
                        <div class="user-avatar me-2 d-flex align-items-center justify-content-center"
                            style="width: 32px; height: 32px; background: rgba(255, 255, 255, 0.2); border-radius: 50%;">
                            <i class="fas fa-user" style="font-size: 0.9rem;"></i>
                        </div>
                        <span class="fw-semibold" th:text="${sinhVien.hoTen}">Sinh Viên</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0" aria-labelledby="studentDropdown"
                        style="border-radius: 10px; margin-top: 0.5rem;">
                        <li>
                            <a class="dropdown-item py-2" th:href="@{/user/thong-tin-sinh-vien}">
                                <i class="fas fa-user-circle me-2 text-primary"></i>Thông tin cá nhân
                            </a>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li>
                            <form th:action="@{/auth/logout}" method="post" class="d-inline w-100">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="dropdown-item py-2 text-danger" aria-label="Đăng xuất">
                                    <i class="fas fa-sign-out-alt me-2"></i>Đăng Xuất
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Student Offcanvas Sidebar -->
        <div class="offcanvas offcanvas-start" tabindex="-1" id="studentSidebar" aria-labelledby="studentSidebarLabel">
            <div class="offcanvas-header bg-primary text-white">
                <h5 class="offcanvas-title" id="studentSidebarLabel">
                    <i class="fas fa-graduation-cap me-2"></i>Menu Sinh Viên
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                    aria-label="Close"></button>
            </div>
            <div class="offcanvas-body p-0">
                <div class="list-group list-group-flush">
                    <a th:href="@{/user/don-dang-ky/create}" class="list-group-item list-group-item-action py-3"
                        th:classappend="${currentURI != null && currentURI.startsWith('/user/don-dang-ky/create') ? 'active' : ''}">
                        <i class="fas fa-plus-circle me-3 text-primary"></i>Tạo Đơn Đăng Ký
                    </a>
                    <a th:href="@{/user/don-dang-ky/my-applications}"
                        class="list-group-item list-group-item-action py-3"
                        th:classappend="${currentURI != null && currentURI.startsWith('/user/don-dang-ky/my-applications') ? 'active' : ''}">
                        <i class="fas fa-list me-3 text-primary"></i>Đơn Của Tôi
                    </a>
                    <a th:href="@{/user/hop-dong}" class="list-group-item list-group-item-action py-3"
                        th:classappend="${currentURI != null && currentURI.startsWith('/user/hop-dong') ? 'active' : ''}">
                        <i class="fas fa-file-contract me-3 text-primary"></i>Hợp Đồng
                    </a>
                    <a th:href="@{/user/hoa-don}" class="list-group-item list-group-item-action py-3"
                        th:classappend="${currentURI != null && currentURI.startsWith('/user/hoa-don') ? 'active' : ''}">
                        <i class="fas fa-receipt me-3 text-primary"></i>Hóa Đơn
                    </a>
                    <a th:href="@{/user/lich-su-thanh-toan}" class="list-group-item list-group-item-action py-3"
                        th:classappend="${currentURI != null && currentURI.startsWith('/user/lich-su-thanh-toan') ? 'active' : ''}">
                        <i class="fas fa-history me-3 text-primary"></i>Lịch Sử Thanh Toán
                    </a>
                </div>
            </div>
        </div>
    </th:block>


    <!-- ============================================================================ -->
    <!-- FRAGMENT: Breadcrumbs                                                         -->
    <!-- ============================================================================ -->
    <nav th:fragment="breadcrumbs(items)" aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item">
                <a th:href="@{/}" aria-label="Trang chủ">
                    <i class="fas fa-home me-1" aria-hidden="true"></i>Trang chủ
                </a>
            </li>
            <li th:each="item, iterStat : ${items}"
                th:classappend="${iterStat.last} ? 'breadcrumb-item active' : 'breadcrumb-item'"
                th:attr="aria-current=${iterStat.last} ? 'page' : null">
                <a th:if="${!iterStat.last}" th:href="${item.url}" th:text="${item.name}"></a>
                <span th:if="${iterStat.last}" th:text="${item.name}"></span>
            </li>
        </ol>
    </nav>

    <!-- ============================================================================ -->
    <!-- FRAGMENT: Skeleton Loading                                                    -->
    <!-- ============================================================================ -->
    <div th:fragment="skeleton-table(rows)">
        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>
                            <div class="skeleton skeleton-text"></div>
                        </th>
                        <th>
                            <div class="skeleton skeleton-text"></div>
                        </th>
                        <th>
                            <div class="skeleton skeleton-text"></div>
                        </th>
                        <th>
                            <div class="skeleton skeleton-text"></div>
                        </th>
                        <th>
                            <div class="skeleton skeleton-text"></div>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="i : ${#numbers.sequence(1, rows)}">
                        <td>
                            <div class="skeleton skeleton-text"></div>
                        </td>
                        <td>
                            <div class="skeleton skeleton-text"></div>
                        </td>
                        <td>
                            <div class="skeleton skeleton-text"></div>
                        </td>
                        <td>
                            <div class="skeleton skeleton-text"></div>
                        </td>
                        <td>
                            <div class="skeleton skeleton-text"></div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ============================================================================ -->
    <!-- FRAGMENT: Common Footer Scripts                                              -->
    <!-- ============================================================================ -->
    <div th:fragment="footer-scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            // Auto-hide alerts after 5 seconds
            setTimeout(function () {
                document.querySelectorAll('.alert:not(.alert-dismissible.fade.show)').forEach(function (alert) {
                    new bootstrap.Alert(alert).close();
                });
            }, 5000);

            // Keyboard shortcuts
            document.addEventListener('keydown', function (e) {
                // Ctrl/Cmd + K: Focus search
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    const searchInput = document.getElementById('searchInput');
                    if (searchInput) {
                        e.preventDefault();
                        searchInput.focus();
                        searchInput.select();
                    }
                }

                // Escape: Close modals and clear search
                if (e.key === 'Escape') {
                    const modals = document.querySelectorAll('.modal.show');
                    modals.forEach(modal => {
                        const bsModal = bootstrap.Modal.getInstance(modal);
                        if (bsModal) bsModal.hide();
                    });

                    const searchInput = document.getElementById('searchInput');
                    if (searchInput && document.activeElement === searchInput) {
                        searchInput.value = '';
                        searchInput.dispatchEvent(new Event('input'));
                        searchInput.blur();
                    }
                }
            });

            // Lazy load images when they come into viewport
            if ('IntersectionObserver' in window) {
                const imageObserver = new IntersectionObserver((entries, observer) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const img = entry.target;
                            if (img.dataset.src) {
                                img.src = img.dataset.src;
                                img.removeAttribute('data-src');
                                observer.unobserve(img);
                            }
                        }
                    });
                });

                document.querySelectorAll('img[data-src]').forEach(img => imageObserver.observe(img));
            }

            // Add loading state to forms on submit
            document.querySelectorAll('form').forEach(form => {
                form.addEventListener('submit', function () {
                    const submitBtn = this.querySelector('button[type="submit"]');
                    if (submitBtn && !submitBtn.disabled) {
                        const originalText = submitBtn.innerHTML;
                        submitBtn.disabled = true;
                        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang xử lý...';

                        // Re-enable after 10 seconds as fallback
                        setTimeout(() => {
                            if (submitBtn.disabled) {
                                submitBtn.disabled = false;
                                submitBtn.innerHTML = originalText;
                            }
                        }, 10000);
                    }
                });
            });

            // Smooth scroll to top on page load if hash exists
            if (window.location.hash) {
                setTimeout(() => {
                    const element = document.querySelector(window.location.hash);
                    if (element) {
                        element.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                }, 100);
            }
        </script>
    </div>

</body>

</html>
