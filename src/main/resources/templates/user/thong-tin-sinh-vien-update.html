<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: header('Cập Nhật Thông Tin', 'Cập nhật thông tin cá nhân của sinh viên.')}"></head>

<body>

    <nav th:replace="~{fragments :: user-navbar}"></nav>

    <main class="container py-4">
        <h1 class="h3 mb-4"><i class="fas fa-user-edit me-2"></i>Cập Nhật Thông Tin Sinh Viên</h1>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Thông tin cá nhân</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/user/thong-tin-sinh-vien/update}" th:object="${sinhVien}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="maSV" class="form-label">Mã Sinh Viên</label>
                            <input type="text" class="form-control" id="maSV" th:field="*{maSV}" readonly>
                        </div>
                        <div class="col-md-6">
                            <label for="hoTen" class="form-label">Họ Tên</label>
                            <input type="text" class="form-control" id="hoTen" th:field="*{hoTen}" readonly>
                        </div>
                        <div class="col-md-6">
                            <label for="lop" class="form-label">Lớp</label>
                            <input type="text" class="form-control" id="lop" th:field="*{lop}" readonly>
                        </div>
                        <div class="col-md-6">
                            <label for="khoa" class="form-label">Khoa</label>
                            <input type="text" class="form-control" id="khoa" th:field="*{khoa}" readonly>
                        </div>
                        <div class="col-md-6">
                            <label for="ngaySinh" class="form-label">Ngày Sinh <span
                                    class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="ngaySinh" name="ngaySinh"
                                th:value="${sinhVien.ngaySinh != null ? #temporals.format(sinhVien.ngaySinh, 'yyyy-MM-dd') : ''}"
                                required>
                        </div>
                        <div class="col-md-6">
                            <label for="gioiTinh" class="form-label">Giới Tính</label>
                            <input type="text" class="form-control" id="gioiTinh" th:field="*{gioiTinh}" readonly>
                        </div>
                        <div class="col-12">
                            <label for="diaChi" class="form-label">Địa Chỉ <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="diaChi" th:field="*{diaChi}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="sdt" class="form-label">Số Điện Thoại <span class="text-danger">*</span></label>
                            <input type="tel" class="form-control" id="sdt" th:field="*{sdt}" required
                                pattern="[0-9]{10,11}">
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" th:value="${taiKhoan.email}" readonly>
                        </div>
                        <div class="col-12 d-grid">
                            <button type="submit" class="btn btn-primary">Cập Nhật</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments :: footer-scripts}"></div>

</body>

</html>
