<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: header('Hợp Đồng Của Tôi', 'Xem danh sách các hợp đồng thuê phòng ký túc xá của bạn.')}"></head>

<body>

<nav th:replace="~{fragments :: user-navbar}"></nav>

<main class="container py-4">
    <h1 class="h3 mb-4">
        <i class="fas fa-file-contract me-2"></i>Hợp Đồng Của Tôi
    </h1>

    <div class="card" th:if="${hopDongs != null}">
        <div class="card-header">
            <h5 class="mb-0">Danh Sách Hợp Đồng</h5>
        </div>
        <div class="card-body">
            <div th:if="${#lists.isEmpty(hopDongs)}" class="alert alert-info">
                Bạn chưa có hợp đồng nào.
            </div>

            <div th:unless="${#lists.isEmpty(hopDongs)}" class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-primary">
                        <tr>
                            <th>Mã HĐ</th>
                            <th>Phòng</th>
                            <th>Ngày Bắt Đầu</th>
                            <th>Ngày Kết Thúc</th>
                            <th>Giá (VNĐ)</th>
                            <th>Trạng Thái</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="hd : ${hopDongs}">
                            <td th:text="${hd.maHD}">1</td>
                            <td th:text="${hd.phong?.soPhong}">P101</td>
                            <td th:text="${#temporals.format(hd.ngayBatDau, 'dd/MM/yyyy')}">01/12/2025</td>
                            <td th:text="${#temporals.format(hd.ngayKetThuc, 'dd/MM/yyyy')}">01/06/2026</td>
                            <td>
                                <strong th:text="${#numbers.formatDecimal(hd.giaThucTe, 0, 'COMMA', 0, 'POINT')}">800,000</strong>
                            </td>
                            <td>
                                <span th:if="${hd.trangThai == 'hieu_luc'}" class="badge bg-success">Hiệu lực</span>
                                <span th:if="${hd.trangThai == 'het_han'}" class="badge bg-secondary">Hết Hạn</span>
                                <span th:if="${hd.trangThai == 'cho_thanh_toan'}" class="badge bg-warning">Chờ Thanh Toán</span>
                                <span th:if="${hd.trangThai == 'da_huy'}" class="badge bg-danger">Đã Hủy</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer-scripts}"></div>

</body>
</html>
