<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: header('Đơn Đăng Ký Của Tôi', 'Trang quản lý các đơn đăng ký phòng ký túc xá của sinh viên.')}"></head>

<body>

<nav th:replace="~{fragments :: user-navbar}"></nav>

<main id="main-content" class="container py-4" role="main">
    <!-- Breadcrumbs -->
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/user/don-dang-ky/my-applications}"><i class="fas fa-home me-1"></i>Trang chủ</a></li>
            <li class="breadcrumb-item active" aria-current="page">Đơn đăng ký của tôi</li>
        </ol>
    </nav>
    
    <h1 class="h3 mb-4"><i class="fas fa-list me-2"></i>Đơn Đăng Ký Của Tôi</h1>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-triangle me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">Danh sách đơn đã nộp</h5>
        </div>
        <div class="card-body">
            <div th:if="${#lists.isEmpty(applications)}" class="text-center py-5">
                <div class="mb-4">
                    <i class="fas fa-inbox fa-4x text-muted mb-3" aria-hidden="true"></i>
                </div>
                <h4 class="text-muted mb-3">Bạn chưa có đơn đăng ký nào</h4>
                <p class="text-muted mb-4">Hãy tạo đơn đăng ký mới để bắt đầu quá trình đăng ký phòng KTX</p>
                <a th:href="@{/user/don-dang-ky/create}" class="btn btn-primary btn-lg">
                    <i class="fas fa-plus-circle me-2" aria-hidden="true"></i>Tạo Đơn Đăng Ký Mới
                </a>
            </div>
            <div th:unless="${#lists.isEmpty(applications)}" class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Mã Đơn</th>
                            <th>Đợt Đăng Ký</th>
                            <th>Ngày Gửi</th>
                            <th>Trạng Thái</th>
                            <th>Ghi Chú</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="app : ${applications}">
                            <td th:text="${app.maDon}">1</td>
                            <td th:text="${app.thoiGianDangKy?.moTa}">HK1 2025</td>
                            <td th:text="${#temporals.format(app.ngayGui, 'dd/MM/yyyy HH:mm')}">01/01/2025</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${app.trangThai == 'duyet' ? 'bg-success' : (app.trangThai == 'tu_choi' ? 'bg-danger' : 'bg-info')}"
                                      th:text="${app.trangThai}"></span>
                            </td>
                            <td th:text="${app.ghiChu}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer-scripts}"></div>

</body>
</html>
