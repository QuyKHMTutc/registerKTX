<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: header('Lịch Sử Thanh Toán', 'Xem lại lịch sử các giao dịch thanh toán của bạn.')}"></head>

<body>

<nav th:replace="~{fragments :: user-navbar}"></nav>

<main class="container py-4">
    <h1 class="h3 mb-4"><i class="fas fa-history me-2"></i>Lịch Sử Thanh Toán</h1>

    <div class="card">
        <div class="card-header">
            <h5 class="mb-0"><i class="fas fa-list me-2"></i>Danh sách giao dịch</h5>
        </div>
        <div class="card-body">
            <div th:if="${#lists.isEmpty(lichSuThanhToans)}" class="alert alert-info">
                Bạn chưa có giao dịch nào.
            </div>
            <div th:unless="${#lists.isEmpty(lichSuThanhToans)}" class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Mã GD</th>
                            <th>Mã Hóa Đơn</th>
                            <th>Số Tiền</th>
                            <th>Phương Thức</th>
                            <th>Ngày Thanh Toán</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="ls : ${lichSuThanhToans}">
                            <td th:text="${ls.maGiaoDich}">1</td>
                            <td th:text="${ls.hoaDon?.maHoaDon}">101</td> <!-- Corrected from ls.maHoaDon -->
                            <td th:text="${#numbers.formatDecimal(ls.soTienThanhToan, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">800,000 VNĐ</td>
                            <td th:text="${ls.phuongThuc}">online</td>
                            <td th:text="${#temporals.format(ls.ngayThanhToan, 'dd/MM/yyyy HH:mm')}">01/12/2025 11:00</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer-scripts}"></div>

</body>
</html>
