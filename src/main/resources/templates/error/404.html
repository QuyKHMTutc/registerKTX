<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: header('404 - Trang không tồn tại', 'Trang báo lỗi khi không tìm thấy tài nguyên.')}"></head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card error-card shadow-lg">
                    <div class="card-header bg-danger text-white text-center">
                        <h4 class="mb-0">Lỗi 404</h4>
                    </div>
                    <div class="card-body p-4 text-center">
                        <h1 class="display-1 text-danger">404</h1>
                        <h3 class="mb-3" th:text="${errorMessage}">Trang không tồn tại</h3>
                        <p class="text-muted mb-4">Trang bạn đang tìm kiếm không tồn tại hoặc đã bị xóa.</p>
                        <div class="d-grid gap-2">
                            <a th:href="@{/auth/login}" class="btn btn-primary">Về trang đăng nhập</a>
                            <a th:href="@{/}" class="btn btn-outline-secondary">Về trang chủ</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
