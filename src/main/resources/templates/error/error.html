<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lỗi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-card {
            max-width: 500px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card error-card shadow-lg">
                    <div class="card-header bg-warning text-dark text-center">
                        <h4 class="mb-0">Lỗi</h4>
                    </div>
                    <div class="card-body p-4 text-center">
                        <h1 class="display-4 text-warning mb-3">⚠️</h1>
                        <h3 class="mb-3" th:text="${errorMessage}">Đã xảy ra lỗi không xác định</h3>
                        <p class="text-muted mb-4">Vui lòng thử lại sau hoặc liên hệ quản trị viên.</p>
                        <div class="d-grid gap-2">
                            <a th:href="@{/auth/login}" class="btn btn-primary">Về trang đăng nhập</a>
                            <button onclick="history.back()" class="btn btn-outline-secondary">Quay lại</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
