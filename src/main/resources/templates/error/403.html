<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: header('403 - Không có quyền truy cập', 'Trang báo lỗi khi người dùng không có quyền truy cập.')}"></head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card error-card shadow-lg">
                    <div class="card-header bg-warning text-dark text-center">
                        <h4 class="mb-0">Lỗi 403</h4>
                    </div>
                    <div class="card-body p-4 text-center">
                        <h1 class="display-1 text-warning">403</h1>
                        <h3 class="mb-3" th:text="${errorMessage}">Không có quyền truy cập</h3>
                        <p class="text-muted mb-4">Bạn không có quyền truy cập trang này. Vui lòng đăng nhập với tài khoản phù hợp.</p>
                        <div class="d-grid gap-2">
                            <a th:href="@{/auth/login}" class="btn btn-primary">Về trang đăng nhập</a>
                            <button onclick="history.back()" class="btn btn-outline-secondary">Quay lại</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
