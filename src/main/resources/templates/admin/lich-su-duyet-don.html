<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/admin-layout :: layout(~{::title}, ~{::meta[name='description'].page-description}, ~{::#admin-lich-su-duyet-don-content})}">

<head>
    <title>Lịch Sử Duyệt Đơn</title>
    <meta name="description" class="page-description" content="Xem lịch sử duyệt các đơn đăng ký phòng ký túc xá.">
</head>

<body>
<div id="admin-lich-su-duyet-don-content" th:fragment="admin-lich-su-duyet-don-content">
    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-2 fw-bold" style="color: #2d3748;">
                <i class="fas fa-clipboard-check me-2 text-primary"></i>Lịch Sử Duyệt Đơn
            </h1>
            <p class="text-muted mb-0">Xem lịch sử duyệt các đơn đăng ký phòng ký túc xá</p>
        </div>
        <div class="badge bg-primary fs-6 px-3 py-2" th:if="${lichSuDuyetDons != null}">
            <i class="fas fa-history me-2"></i>
            <span th:text="${#lists.size(lichSuDuyetDons)}">0</span> bản ghi
        </div>
    </div>

    <!-- History Table Card -->
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-bottom">
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-semibold">
                    <i class="fas fa-list me-2 text-primary"></i>Toàn bộ lịch sử
                </h5>
                <button class="btn btn-sm btn-outline-primary" onclick="location.reload()" aria-label="Làm mới">
                    <i class="fas fa-sync-alt me-1"></i>Làm mới
                </button>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th style="width: 100px;">Mã LS</th>
                        <th>Mã Đơn</th>
                        <th>Người Duyệt</th>
                        <th>Trạng Thái</th>
                        <th>Ghi Chú</th>
                        <th>Thời Gian</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="ls : ${lichSuDuyetDons}" style="transition: all 0.2s ease;">
                        <td>
                            <span class="badge bg-secondary fs-6" th:text="'#' + ${ls.maLS}">#1</span>
                        </td>
                        <td>
                            <span class="badge bg-primary" th:text="'Đơn #' + ${ls.donDangKy?.maDon}">Đơn #101</span>
                        </td>
                        <td>
                            <div class="d-flex align-items-center">
                                <div class="me-2">
                                    <div class="bg-primary bg-gradient rounded-circle d-flex align-items-center justify-content-center text-white" style="width: 32px; height: 32px; font-size: 0.75rem;">
                                        <i class="fas fa-user-shield"></i>
                                    </div>
                                </div>
                                <div class="fw-semibold" th:text="${ls.nhanVien?.hoTen}">Nguyễn Văn A</div>
                            </div>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${ls.trangThaiMoi == 'duyet' ? 'bg-success' : 'bg-danger'}"
                                  th:text="${ls.trangThaiMoi == 'duyet' ? 'Đã duyệt' : 'Từ chối'}">Đã duyệt</span>
                        </td>
                        <td>
                            <span class="text-muted" th:text="${ls.ghiChu}">Đã duyệt</span>
                        </td>
                        <td>
                            <div class="text-muted">
                                <i class="fas fa-calendar-alt me-1"></i>
                                <span th:text="${#temporals.format(ls.thoiGian, 'dd/MM/yyyy')}">01/12/2025</span>
                            </div>
                            <small class="text-muted">
                                <i class="fas fa-clock me-1"></i>
                                <span th:text="${#temporals.format(ls.thoiGian, 'HH:mm')}">10:30</span>
                            </small>
                        </td>
                    </tr>
                    <tr th:if="${lichSuDuyetDons == null || #lists.isEmpty(lichSuDuyetDons)}">
                        <td colspan="6" class="text-center py-5">
                            <div class="text-muted">
                                <i class="fas fa-clipboard-check fa-3x mb-3" style="opacity: 0.3;"></i>
                                <p class="mb-0 fs-5">Chưa có lịch sử duyệt đơn</p>
                                <small>Lịch sử sẽ xuất hiện sau khi duyệt đơn đăng ký</small>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
