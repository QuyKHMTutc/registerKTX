<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>

    <div th:fragment="admin-sidebar"
        class="sidebar admin-sidebar d-flex flex-column flex-shrink-0 p-3 text-white bg-dark">
        <!-- Logo/Brand Section -->
        <a th:href="@{/admin/phong}"
            class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
            <span class="fs-4">Admin KTX</span>
        </a>
        <hr>


        <!-- Navigation Menu -->
        <div class="flex-grow-1 overflow-auto" style="padding: 1rem 0;">
            <ul class="nav nav-pills flex-column mb-auto px-3" style="gap: 0.5rem;">
                <li class="nav-item">
                    <a class="nav-link text-white d-flex align-items-center py-3 px-3 rounded-3"
                        th:classappend="${currentURI.startsWith('/admin/phong') ? 'active' : ''}"
                        th:href="@{/admin/phong}" aria-label="Quản lý phòng"
                        style="transition: all 0.3s ease; border: none;">
                        <i class="fas fa-door-open me-3" style="width: 20px; text-align: center;"></i>
                        <span>Quản lý Phòng</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white d-flex align-items-center py-3 px-3 rounded-3"
                        th:classappend="${currentURI.startsWith('/admin/don-dang-ky') ? 'active' : ''}"
                        th:href="@{/admin/don-dang-ky}" aria-label="Duyệt đơn đăng ký"
                        style="transition: all 0.3s ease; border: none;">
                        <i class="fas fa-file-alt me-3" style="width: 20px; text-align: center;"></i>
                        <span>Duyệt Đơn</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white d-flex align-items-center py-3 px-3 rounded-3"
                        th:classappend="${currentURI.startsWith('/admin/hop-dong') ? 'active' : ''}"
                        th:href="@{/admin/hop-dong}" aria-label="Quản lý hợp đồng"
                        style="transition: all 0.3s ease; border: none; text-decoration: none; display: block;">
                        <i class="fas fa-file-contract me-3" style="width: 20px; text-align: center;"></i>
                        <span>Hợp Đồng</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white d-flex align-items-center py-3 px-3 rounded-3"
                        th:classappend="${currentURI.startsWith('/admin/hoa-don') ? 'active' : ''}"
                        th:href="@{/admin/hoa-don}" aria-label="Quản lý hóa đơn"
                        style="transition: all 0.3s ease; border: none; text-decoration: none; display: block;">
                        <i class="fas fa-receipt me-3" style="width: 20px; text-align: center;"></i>
                        <span>Hóa Đơn</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white d-flex align-items-center py-3 px-3 rounded-3"
                        th:classappend="${currentURI.startsWith('/admin/lich-su') ? 'active' : ''}"
                        th:href="@{/admin/lich-su-duyet-don}" aria-label="Lịch sử duyệt đơn"
                        style="transition: all 0.3s ease; border: none; text-decoration: none; display: block;">
                        <i class="fas fa-clipboard-check me-3" style="width: 20px; text-align: center;"></i>
                        <span>Lịch Sử</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white d-flex align-items-center py-3 px-3 rounded-3"
                        th:classappend="${currentURI.startsWith('/admin/tai-khoan') ? 'active' : ''}"
                        th:href="@{/admin/tai-khoan}" aria-label="Quản lý tài khoản"
                        style="transition: all 0.3s ease; border: none; text-decoration: none; display: block;">
                        <i class="fas fa-users-cog me-3" style="width: 20px; text-align: center;"></i>
                        <span>Tài Khoản</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white d-flex align-items-center py-3 px-3 rounded-3"
                        th:classappend="${currentURI.startsWith('/admin/thoi-gian-dang-ky') ? 'active' : ''}"
                        th:href="@{/admin/thoi-gian-dang-ky}" aria-label="Quản lý thời gian đăng ký"
                        style="transition: all 0.3s ease; border: none; text-decoration: none; display: block;">
                        <i class="fas fa-calendar-alt me-3" style="width: 20px; text-align: center;"></i>
                        <span>Thời Gian ĐK</span>
                    </a>
                </li>
            </ul>
        </div>

    </div>

    <script>
        // Đảm bảo các link trong sidebar hoạt động đúng
        document.addEventListener('DOMContentLoaded', function () {
            const navLinks = document.querySelectorAll('.admin-sidebar .nav-link:not(.dropdown-toggle)');
            navLinks.forEach(link => {
                // Đảm bảo link có thể click được
                link.style.pointerEvents = 'auto';
                link.style.cursor = 'pointer';
                link.style.position = 'relative';
                link.style.zIndex = '10';

                // Debug: Log khi click để kiểm tra
                link.addEventListener('click', function (e) {
                    const href = this.getAttribute('href');
                    console.log('Sidebar link clicked:', href);
                    // Nếu href hợp lệ, cho phép navigation
                    if (href && href !== '#' && href !== 'javascript:void(0)') {
                        // Không preventDefault, để browser xử lý navigation tự nhiên
                    } else {
                        e.preventDefault();
                    }
                });
            });
        });
    </script>

</body>

</html>
