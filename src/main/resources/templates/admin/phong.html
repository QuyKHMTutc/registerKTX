<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{admin/admin-layout :: layout(~{::title}, ~{::meta[name='description'].page-description}, ~{::#admin-phong-content})}">

<head>
    <title>Quản lý Phòng</title>
    <meta name="description" class="page-description" content="Trang quản lý thông tin các phòng trong ký túc xá.">
</head>

<body>
    <div id="admin-phong-content" th:fragment="admin-phong-content">
        <!-- Flash Messages handled in admin-layout -->

        <!-- Page Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-2 fw-bold" style="color: #2d3748;">
                    <i class="fas fa-door-open me-2 text-primary"></i>Quản lý Phòng
                </h1>
                <p class="text-muted mb-0">Quản lý thông tin các phòng trong ký túc xá</p>
            </div>
        </div>

        <!-- Create Room Form -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-plus-circle me-2"></i>Tạo Phòng Mới</h5>
            </div>
            <div class="card-body">
                <!-- Removed novalidate and onsubmit -->
                <form th:action="@{/admin/phong}" th:object="${phongForm}" method="post" id="phongForm">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label for="soPhong" class="form-label">Số Phòng <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="soPhong" th:field="*{soPhong}" required
                                pattern="[A-Za-z0-9]+" title="Số phòng chỉ được chứa chữ cái và số"
                                th:classappend="${#fields.hasErrors('soPhong')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('soPhong')}"
                                th:errors="*{soPhong}"></div>
                        </div>
                        <div class="col-md-2">
                            <label for="tang" class="form-label">Tầng <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="tang" th:field="*{tang}" required min="1"
                                max="20" th:classappend="${#fields.hasErrors('tang')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('tang')}" th:errors="*{tang}">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label for="maLoai" class="form-label">Loại Phòng <span class="text-danger">*</span></label>
                            <select class="form-select" id="maLoai" th:field="*{maLoai}" required
                                th:classappend="${#fields.hasErrors('maLoai')} ? 'is-invalid' : ''">
                                <option value="">-- Chọn loại --</option>
                                <option th:each="loai : ${loaiPhongs}" th:value="${loai.maLoai}"
                                    th:text="${loai.tenLoai}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('maLoai')}" th:errors="*{maLoai}">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label for="maToa" class="form-label">Tòa Nhà <span class="text-danger">*</span></label>
                            <select class="form-select" id="maToa" th:field="*{maToa}" required
                                th:classappend="${#fields.hasErrors('maToa')} ? 'is-invalid' : ''">
                                <option value="">-- Chọn tòa --</option>
                                <option th:each="toa : ${toaNhas}" th:value="${toa.maToa}" th:text="${toa.tenToa}">
                                </option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('maToa')}" th:errors="*{maToa}">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label for="gioiTinh" class="form-label">Giới Tính <span
                                    class="text-danger">*</span></label>
                            <select class="form-select" id="gioiTinh" th:field="*{gioiTinh}" required
                                th:classappend="${#fields.hasErrors('gioiTinh')} ? 'is-invalid' : ''">
                                <option value="">-- Chọn giới tính --</option>
                                <option value="Nam">Nam</option>
                                <option value="Nu">Nữ</option>
                                <option value="KhongYeuCau">Không Yêu Cầu</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('gioiTinh')}"
                                th:errors="*{gioiTinh}"></div>
                        </div>
                        <div class="col-12 d-grid">
                            <!-- Added simple onclick confirmation -->
                            <button type="submit" class="btn btn-primary" aria-label="Tạo phòng mới"
                                onclick="return confirm('Bạn có chắc chắn muốn tạo phòng này?')">
                                <i class="fas fa-plus me-2" aria-hidden="true"></i>Tạo Phòng
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Room List -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="fas fa-list me-2"></i>Danh sách Phòng</h5>
                <div class="d-flex gap-2">
                    <div class="input-group" style="max-width: 300px;">
                        <span class="input-group-text"><i class="fas fa-search"></i></span>
                        <input type="text" id="searchInput" class="form-control form-control-sm"
                            placeholder="Tìm kiếm phòng..." aria-label="Tìm kiếm">
                    </div>
                </div>
            </div>
            <div class="card-body table-responsive">
                <table class="table table-striped table-hover align-middle" id="phongTable">
                    <thead class="table-light">
                        <tr>
                            <th style="cursor: pointer;" onclick="sortTable(0)">
                                Số Phòng <i class="fas fa-sort ms-1"></i>
                            </th>
                            <th style="cursor: pointer;" onclick="sortTable(1)">
                                Tòa Nhà <i class="fas fa-sort ms-1"></i>
                            </th>
                            <th style="cursor: pointer;" onclick="sortTable(2)">
                                Loại Phòng <i class="fas fa-sort ms-1"></i>
                            </th>
                            <th style="cursor: pointer;" onclick="sortTable(3)">
                                Giới Tính <i class="fas fa-sort ms-1"></i>
                            </th>
                            <th style="cursor: pointer;" onclick="sortTable(4)">
                                Trạng Thái <i class="fas fa-sort ms-1"></i>
                            </th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr th:each="phong : ${phongs}" class="phong-row">
                            <td class="so-phong" th:text="${phong.soPhong}"></td>
                            <td class="ten-toa" th:text="${phong.toaNha.tenToa}"></td>
                            <td class="ten-loai" th:text="${phong.loaiPhong.tenLoai}"></td>
                            <td class="gioi-tinh" th:text="${phong.gioiTinh}"></td>
                            <td class="trang-thai">
                                <span th:if="${phong.trangThai == 'san_sang'}" class="badge bg-success">Sẵn sàng</span>
                                <span th:if="${phong.trangThai == 'day_cho'}" class="badge bg-danger">Đầy chỗ</span>
                                <span th:if="${phong.trangThai == 'baotri'}" class="badge bg-warning">Bảo trì</span>
                                <span
                                    th:unless="${phong.trangThai == 'san_sang' || phong.trangThai == 'day_cho' || phong.trangThai == 'baotri'}"
                                    class="badge bg-secondary">Không xác định</span>
                            </td>
                            <td>
                                <form th:if="${phong.trangThai == 'san_sang'}"
                                    th:action="@{/admin/phong/{id}/trangthai(id=${phong.maPhong})}" method="post"
                                    class="d-inline">
                                    <input type="hidden" name="trangThai" value="baotri" />
                                    <button type="submit" class="btn btn-outline-warning btn-sm"
                                        onclick="return confirm('Bạn có chắc muốn chuyển phòng này sang trạng thái BẢO TRÌ?')">
                                        <i class="fas fa-tools me-1"></i> Bảo trì
                                    </button>
                                </form>
                                <form th:if="${phong.trangThai == 'baotri'}"
                                    th:action="@{/admin/phong/{id}/trangthai(id=${phong.maPhong})}" method="post"
                                    class="d-inline">
                                    <input type="hidden" name="trangThai" value="san_sang" />
                                    <button type="submit" class="btn btn-outline-success btn-sm"
                                        onclick="return confirm('Bạn có chắc muốn chuyển phòng này sang trạng thái SẴN SÀNG?')">
                                        <i class="fas fa-check-circle me-1"></i> Sẵn sàng
                                    </button>
                                </form>
                                <span th:if="${phong.trangThai == 'day_cho'}" class="text-muted fst-italic small">Không
                                    có hành động</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div id="noResults" class="text-center py-4" style="display: none;">
                    <i class="fas fa-search fa-3x text-muted mb-3"></i>
                    <p class="text-muted">Không tìm thấy phòng nào phù hợp</p>
                </div>
                <div id="pagination" class="d-flex justify-content-center mt-3"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const searchInput = document.getElementById('searchInput');
            const tableBody = document.getElementById('tableBody');
            const rows = Array.from(tableBody.getElementsByClassName('phong-row'));
            const noResults = document.getElementById('noResults');
            const pagination = document.getElementById('pagination');

            let currentPage = 1;
            const itemsPerPage = 10;
            let filteredRows = [...rows];

            function filterRows() {
                const searchTerm = searchInput.value.toLowerCase().trim();

                filteredRows = rows.filter(row => {
                    const soPhong = row.querySelector('.so-phong').textContent.toLowerCase();
                    const tenToa = row.querySelector('.ten-toa').textContent.toLowerCase();
                    const tenLoai = row.querySelector('.ten-loai').textContent.toLowerCase();
                    const gioiTinh = row.querySelector('.gioi-tinh').textContent.toLowerCase();

                    return soPhong.includes(searchTerm) ||
                        tenToa.includes(searchTerm) ||
                        tenLoai.includes(searchTerm) ||
                        gioiTinh.includes(searchTerm);
                });

                currentPage = 1;
                renderTable();
            }

            function renderTable() {
                // Hide all rows first
                rows.forEach(row => row.style.display = 'none');

                if (filteredRows.length === 0) {
                    noResults.style.display = 'block';
                    pagination.innerHTML = '';
                    return;
                }

                noResults.style.display = 'none';

                const start = (currentPage - 1) * itemsPerPage;
                const end = start + itemsPerPage;
                const pageRows = filteredRows.slice(start, end);

                pageRows.forEach(row => row.style.display = '');

                renderPagination();
            }

            function renderPagination() {
                const totalPages = Math.ceil(filteredRows.length / itemsPerPage);

                pagination.innerHTML = '';
                if (totalPages <= 1) return;

                let paginationHTML = '<nav aria-label="Phân trang"><ul class="pagination">';

                // Previous button
                paginationHTML += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" data-page="${currentPage - 1}" aria-label="Trang trước">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                </li>`;

                for (let i = 1; i <= totalPages; i++) {
                    if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                        paginationHTML += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                            <a class="page-link" href="#" data-page="${i}">${i}</a>
                        </li>`;
                    } else if (i === currentPage - 3 || i === currentPage + 3) {
                        paginationHTML += '<li class="page-item disabled"><span class="page-link">...</span></li>';
                    }
                }

                // Next button
                paginationHTML += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                    <a class="page-link" href="#" data-page="${currentPage + 1}" aria-label="Trang sau">
                        <span aria-hidden="true">&raquo;</span>
                    </a>
                </li>`;

                paginationHTML += '</ul></nav>';
                pagination.innerHTML = paginationHTML;

                // Add event listeners to pagination links
                pagination.querySelectorAll('.page-link').forEach(link => {
                    link.addEventListener('click', function (e) {
                        e.preventDefault();
                        const page = parseInt(this.getAttribute('data-page'));
                        if (page >= 1 && page <= totalPages) {
                            currentPage = page;
                            renderTable();
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        }
                    });
                });
            }

            // Initial setup
            searchInput.addEventListener('input', filterRows);

            // Expose sortTable globally if needed, or implement DOM-based sorting
            window.sortTable = function (columnIndex) {
                // Simple DOM sorting implementation could go here if needed
                // For now, we'll keep it simple as the user just wanted the list back
                console.log('Sorting not implemented for server-side rendered list yet');
            };

            renderTable();
        });
    </script>

</body>

</html>
