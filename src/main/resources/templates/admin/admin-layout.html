<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, description, content)">

<head th:replace="~{fragments :: header(${title}, ${description})}">
    <title>Admin Layout</title>
</head>

<body>
    <!-- Skip to main content for accessibility -->
    <a href="#main-content" class="visually-hidden-focusable btn btn-primary position-absolute top-0 start-0 m-2"
        style="z-index: 9999;">
        Bỏ qua đến nội dung chính
    </a>

    <div class="d-flex">
        <!-- Fixed Sidebar for Desktop -->
        <!-- Fixed Sidebar for Desktop -->
        <div class="d-none d-lg-block" style="width: 280px; flex-shrink: 0;">
            <div th:replace="~{admin/admin-sidebar :: admin-sidebar}"></div>
        </div>

        <!-- Offcanvas Sidebar for Mobile -->
        <div class="offcanvas offcanvas-start text-bg-dark" tabindex="-1" id="adminNavigationDrawer"
            aria-labelledby="adminNavigationDrawerLabel">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="adminNavigationDrawerLabel">Admin Menu</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                    aria-label="Close"></button>
            </div>
            <div class="offcanvas-body p-0">
                <div th:replace="~{admin/admin-sidebar :: admin-sidebar}"></div>
            </div>
        </div>

        <div class="admin-main-content flex-grow-1">
            <!-- Admin Top Navbar (Minimal) -->
            <nav th:replace="~{admin/admin-navbar :: admin-navbar}"></nav>

            <main id="main-content" class="container-fluid py-4">
                <!-- Flash Messages -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-3"
                    role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Content will be injected here -->
                <th:block th:insert="${content} ?: _"></th:block>
            </main>
        </div>
    </div>

    <div th:replace="~{fragments :: footer-scripts}"></div>
</body>

</html>
