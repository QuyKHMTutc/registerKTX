<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{admin/admin-layout :: layout(~{::title}, ~{::meta[name='description'].page-description}, ~{::#admin-thoi-gian-content})}">

<head>
    <title>Quản Lý Thời Gian Đăng Ký</title>
    <meta name="description" class="page-description" content="Trang quản lý thời gian đăng ký cho admin.">
</head>

<body>
    <div id="admin-thoi-gian-content" th:fragment="admin-thoi-gian-content">
        <h2 class="mb-4"><i class="fas fa-calendar-alt me-2"></i>Quản Lý Thời Gian Đăng Ký</h2>

        <!-- Alerts -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Create New Period Button -->
        <div class="mb-3">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createModal">
                <i class="fas fa-plus me-2"></i>Tạo Đợt Đăng Ký Mới
            </button>
        </div>

        <!-- Periods Table -->
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Danh Sách Đợt Đăng Ký</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Mã Đợt</th>
                                <th>Ngày Mở</th>
                                <th>Ngày Đóng</th>
                                <th>Mô Tả</th>
                                <th>Trạng Thái</th>
                                <th>Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${periods.empty}">
                                <td colspan="6" class="text-center text-muted">Chưa có đợt đăng ký nào</td>
                            </tr>
                            <tr th:each="period : ${periods}">
                                <td th:text="${period.maDot}"></td>
                                <td th:text="${#temporals.format(period.ngayMo, 'dd/MM/yyyy HH:mm')}"></td>
                                <td th:text="${#temporals.format(period.ngayDong, 'dd/MM/yyyy HH:mm')}"></td>
                                <td th:text="${period.moTa}"></td>
                                <td>
                                    <span
                                        th:if="${#temporals.createNow().isAfter(period.ngayMo) && #temporals.createNow().isBefore(period.ngayDong)}"
                                        class="badge bg-success">
                                        <i class="fas fa-check-circle me-1"></i>Đang Mở
                                    </span>
                                    <span th:if="${#temporals.createNow().isBefore(period.ngayMo)}"
                                        class="badge bg-warning">
                                        <i class="fas fa-clock me-1"></i>Sắp Mở
                                    </span>
                                    <span th:if="${#temporals.createNow().isAfter(period.ngayDong)}"
                                        class="badge bg-secondary">
                                        <i class="fas fa-times-circle me-1"></i>Đã Đóng
                                    </span>
                                </td>
                                <td>
                                    <div class="btn-group" role="group" aria-label="Thao tác">
                                        <button type="button" class="btn btn-sm btn-outline-primary"
                                            th:attr="data-ma-dot=${period.maDot},data-ngay-mo=${#temporals.format(period.ngayMo, 'yyyy-MM-dd HH:mm')},data-ngay-dong=${#temporals.format(period.ngayDong, 'yyyy-MM-dd HH:mm')},data-mo-ta=${period.moTa}"
                                            onclick="editPeriodFromData(this)" data-bs-toggle="tooltip"
                                            data-bs-placement="top" title="Chỉnh sửa">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                        <form
                                            th:action="@{/admin/thoi-gian-dang-ky/{maDot}/delete(maDot=${period.maDot})}"
                                            method="post" class="d-inline"
                                            onsubmit="return confirm('Bạn có chắc muốn xóa đợt đăng ký này?');">
                                            <input type="hidden" th:name="${_csrf.parameterName}"
                                                th:value="${_csrf.token}" />
                                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                                data-bs-toggle="tooltip" data-bs-placement="top" title="Xóa">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Create Modal -->
        <div class="modal fade" id="createModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Tạo Đợt Đăng Ký Mới</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form th:action="@{/admin/thoi-gian-dang-ky}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="createNgayMo" class="form-label">Ngày Mở <span
                                        class="text-danger">*</span></label>
                                <input type="datetime-local" class="form-control" id="createNgayMo" name="ngayMo"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label for="createNgayDong" class="form-label">Ngày Đóng <span
                                        class="text-danger">*</span></label>
                                <input type="datetime-local" class="form-control" id="createNgayDong" name="ngayDong"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label for="createMoTa" class="form-label">Mô Tả</label>
                                <textarea class="form-control" id="createMoTa" name="moTa" rows="3"
                                    placeholder="Ví dụ: Đợt đăng ký học kỳ 1 năm 2024"></textarea>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                            <button type="submit" class="btn btn-primary">Tạo Mới</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Edit Modal -->
        <div class="modal fade" id="editModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Chỉnh Sửa Đợt Đăng Ký</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form id="editForm" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="editNgayMo" class="form-label">Ngày Mở <span
                                        class="text-danger">*</span></label>
                                <input type="datetime-local" class="form-control" id="editNgayMo" name="ngayMo"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label for="editNgayDong" class="form-label">Ngày Đóng <span
                                        class="text-danger">*</span></label>
                                <input type="datetime-local" class="form-control" id="editNgayDong" name="ngayDong"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label for="editMoTa" class="form-label">Mô Tả</label>
                                <textarea class="form-control" id="editMoTa" name="moTa" rows="3"></textarea>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                            <button type="submit" class="btn btn-primary">Cập Nhật</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script>
            function editPeriodFromData(button) {
                const maDot = button.getAttribute('data-ma-dot');
                const ngayMo = button.getAttribute('data-ngay-mo');
                const ngayDong = button.getAttribute('data-ngay-dong');
                const moTa = button.getAttribute('data-mo-ta');

                // Convert "yyyy-MM-dd HH:mm" to "yyyy-MM-ddTHH:mm" for datetime-local input
                const ngayMoFormatted = ngayMo.replace(' ', 'T');
                const ngayDongFormatted = ngayDong.replace(' ', 'T');

                document.getElementById('editForm').action = '/admin/thoi-gian-dang-ky/' + maDot + '/update';
                document.getElementById('editNgayMo').value = ngayMoFormatted;
                document.getElementById('editNgayDong').value = ngayDongFormatted;
                document.getElementById('editMoTa').value = moTa || '';
                new bootstrap.Modal(document.getElementById('editModal')).show();
            }

            // Initialize tooltips
            document.addEventListener('DOMContentLoaded', function () {
                const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
                tooltipTriggerList.map(function (tooltipTriggerEl) {
                    return new bootstrap.Tooltip(tooltipTriggerEl);
                });
            });
        </script>
    </div>
</body>

</html>
