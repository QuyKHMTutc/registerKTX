<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/admin-layout :: layout(~{::title}, ~{::meta[name='description'].page-description}, ~{::#admin-profile-content})}">

<head>
    <title>Hồ Sơ Nhân Viên</title>
    <meta name="description" class="page-description" content="Xem và quản lý thông tin hồ sơ nhân viên.">
</head>

<body>
<div id="admin-profile-content" th:fragment="admin-profile-content">
    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-2 fw-bold" style="color: #2d3748;">
                <i class="fas fa-user me-2 text-primary"></i>Hồ Sơ Nhân Viên
            </h1>
            <p class="text-muted mb-0">Thông tin chi tiết về tài khoản của bạn</p>
        </div>
    </div>

    <!-- Profile Card -->
    <div class="row">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-white border-bottom">
                    <h5 class="mb-0 fw-semibold">
                        <i class="fas fa-info-circle me-2 text-primary"></i>Thông Tin Cá Nhân
                    </h5>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label text-muted fw-semibold">Mã Nhân Viên</label>
                            <div class="form-control-plaintext">
                                <span class="badge bg-primary fs-6" th:text="'#' + ${nhanVien.maNV}">#1</span>
                            </div>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label text-muted fw-semibold">Họ và Tên</label>
                            <div class="form-control-plaintext fs-5 fw-semibold" th:text="${nhanVien.hoTen}">Nguyễn Văn A</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Account Information Card -->
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-bottom">
                    <h5 class="mb-0 fw-semibold">
                        <i class="fas fa-key me-2 text-primary"></i>Thông Tin Tài Khoản
                    </h5>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label text-muted fw-semibold">Tên Đăng Nhập</label>
                            <div class="form-control-plaintext" th:text="${taiKhoan.tenDangNhap}">admin</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted fw-semibold">Email</label>
                            <div class="form-control-plaintext" th:text="${taiKhoan.email}">admin@example.com</div>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label text-muted fw-semibold">Loại Tài Khoản</label>
                            <div class="form-control-plaintext">
                                <span class="badge bg-success" th:text="${taiKhoan.loaiTK == 'NV' ? 'Nhân Viên' : taiKhoan.loaiTK}">Nhân Viên</span>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted fw-semibold">Trạng Thái</label>
                            <div class="form-control-plaintext">
                                <span class="badge" 
                                      th:classappend="${taiKhoan.trangThai == 1 ? 'bg-success' : 'bg-secondary'}"
                                      th:text="${taiKhoan.trangThai == 1 ? 'Hoạt động' : 'Không hoạt động'}">Hoạt động</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body text-center">
                    <div class="mb-3">
                        <div class="bg-primary bg-gradient rounded-circle d-flex align-items-center justify-content-center text-white mx-auto" 
                             style="width: 120px; height: 120px; font-size: 3rem;">
                            <i class="fas fa-user"></i>
                        </div>
                    </div>
                    <h5 class="fw-bold mb-1" th:text="${nhanVien.hoTen}">Nguyễn Văn A</h5>
                    <p class="text-muted mb-3">Quản trị viên</p>
                    <div class="d-grid gap-2">
                        <a th:href="@{/admin/settings}" class="btn btn-outline-primary">
                            <i class="fas fa-cog me-2"></i>Cài Đặt
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
