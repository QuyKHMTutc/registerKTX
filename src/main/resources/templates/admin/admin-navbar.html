<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>

    <nav th:fragment="admin-navbar" class="admin-top-navbar mb-4" role="navigation" aria-label="Admin top navigation">
        <div class="container-fluid d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center">
                <!-- Nút Hamburger để mở Navigation Drawer (chỉ hiển thị trên mobile) -->
                <button class="btn btn-outline-secondary me-3 d-lg-none" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#adminNavigationDrawer" aria-controls="adminNavigationDrawer"
                    aria-label="Toggle admin navigation" style="border-radius: 8px;">
                    <i class="fas fa-bars"></i>
                </button>

                <!-- Breadcrumbs Navigation -->
                <nav aria-label="breadcrumb" class="mb-0">
                    <ol class="breadcrumb mb-0" style="background: transparent; padding: 0; margin: 0;">
                        <li class="breadcrumb-item">
                            <a th:href="@{/admin/phong}" class="text-decoration-none d-flex align-items-center"
                                style="color: #6c757d; font-weight: 500; transition: color 0.2s;">
                                <i class="fas fa-home me-1"></i>Trang chủ
                            </a>
                        </li>
                        <li class="breadcrumb-item active d-flex align-items-center" aria-current="page"
                            th:if="${pageTitle}">
                            <i class="fas fa-chevron-right me-2" style="font-size: 0.75rem; color: #9ca3af;"></i>
                            <span style="color: #2d3748; font-weight: 600;" th:text="${pageTitle}"></span>
                        </li>
                    </ol>
                </nav>
            </div>

            <!-- Right side actions -->
            <div class="d-flex align-items-center gap-3">
                <!-- Notifications Dropdown -->
                <div class="dropdown">
                    <button class="btn btn-link text-primary position-relative" type="button" id="notificationDropdown"
                        data-bs-toggle="dropdown" aria-expanded="false" aria-label="Thông báo"
                        style="border: none; padding: 0.5rem; transition: color 0.2s;">
                        <i class="fas fa-bell fs-5"></i>
                        <span th:if="${unreadNotificationCount > 0}" id="notificationBadge"
                            class="notification-badge-custom"
                            th:text="${unreadNotificationCount > 99 ? '99+' : unreadNotificationCount}">0</span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end shadow-lg border-0 p-0"
                        aria-labelledby="notificationDropdown"
                        style="width: 380px; max-height: 500px; border-radius: 12px; margin-top: 0.5rem;">
                        <div class="dropdown-header px-3 py-3 border-bottom" style="background: #f8f9fa;">
                            <h6 class="mb-0 fw-bold text-dark">Thông Báo</h6>
                        </div>
                        <div id="notificationList" class="overflow-auto" style="max-height: 400px;">
                            <div class="text-center py-4 text-muted">
                                <i class="fas fa-spinner fa-spin fs-4"></i>
                                <p class="mt-2 mb-0">Đang tải...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- User info with Dropdown -->
                <div class="dropdown">
                    <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle"
                        data-bs-toggle="dropdown" aria-expanded="false" id="userDropdown">
                        <div class="user-avatar me-2 d-flex align-items-center justify-content-center"
                            style="width: 32px; height: 32px; background-color: #e2e8f0; border-radius: 50%; color: #4a5568;">
                            <i class="fas fa-user" style="font-size: 0.8rem;"></i>
                        </div>
                        <span class="fw-semibold d-none d-md-block" style="color: #4a5568;"
                            th:text="${admin?.hoTen ?: 'Admin'}">Admin</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0" aria-labelledby="userDropdown"
                        style="border-radius: 10px; margin-top: 0.5rem;">
                        <li><a class="dropdown-item py-2" th:href="@{/admin/settings}"><i
                                    class="fas fa-cog me-2 text-muted"></i>Cài đặt</a></li>
                        <li><a class="dropdown-item py-2" th:href="@{/admin/profile}"><i
                                    class="fas fa-user me-2 text-muted"></i>Hồ sơ</a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li>
                            <form th:action="@{/auth/logout}" method="post" class="d-inline w-100">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="dropdown-item py-2 text-danger" aria-label="Đăng xuất">
                                    <i class="fas fa-sign-out-alt me-2"></i>Đăng Xuất
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>



        <script>
            console.log('Notification script loaded!');

            // Fetch and display notifications
            function loadNotifications() {
                console.log('Loading notifications...');
                fetch('/admin/thong-bao/unread')
                    .then(response => {
                        console.log('Response status:', response.status);
                        return response.json();
                    })
                    .then(notifications => {
                        console.log('Notifications received:', notifications);
                        const listContainer = document.getElementById('notificationList');

                        if (notifications.length === 0) {
                            listContainer.innerHTML = `
                                <div class="text-center py-5">
                                    <div class="mb-3">
                                        <i class="fas fa-bell-slash" style="font-size: 3rem; color: #cbd5e0;"></i>
                                    </div>
                                    <p class="text-muted mb-0" style="font-size: 0.95rem;">Không có thông báo mới</p>
                                    <small class="text-muted">Bạn đã xem hết tất cả thông báo</small>
                                </div>
                            `;
                            return;
                        }

                        listContainer.innerHTML = notifications.map(notif => `
                            <div class="notification-item px-3 py-3 border-bottom ${notif.daDoc ? '' : 'unread'}" 
                                 style="cursor: pointer;" 
                                 onclick="markAsRead(${notif.maThongBao}, ${notif.maDon})">
                                <div class="d-flex align-items-start">
                                    <div class="flex-shrink-0 me-3">
                                        <div class="rounded-circle d-flex align-items-center justify-content-center"
                                             style="width: 40px; height: 40px; background: #edf2f7;">
                                            <i class="fas fa-file-alt text-primary"></i>
                                        </div>
                                    </div>
                                    <div class="flex-grow-1">
                                        <h6 class="mb-1 fw-semibold" style="font-size: 0.9rem;">${notif.tieuDe}</h6>
                                        <p class="mb-1 text-muted" style="font-size: 0.85rem;">${notif.noiDung}</p>
                                        <small class="text-muted">
                                            <i class="far fa-clock me-1"></i>${formatTime(notif.ngayTao)}
                                        </small>
                                    </div>
                                    ${!notif.daDoc ? '<div class="flex-shrink-0"><span class="badge bg-primary rounded-circle p-1" style="width: 10px; height: 10px;"></span></div>' : ''}
                                </div>
                            </div>
                        `).join('');
                    })
                    .catch(error => {
                        console.error('Error loading notifications:', error);
                        document.getElementById('notificationList').innerHTML = `
                            <div class="text-center py-5">
                                <div class="mb-3">
                                    <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #fc8181;"></i>
                                </div>
                                <p class="text-danger mb-0">Không thể tải thông báo</p>
                                <small class="text-muted">Vui lòng thử lại sau</small>
                            </div>
                        `;
                    });
            }

            function markAsRead(notificationId, applicationId) {
                fetch(`/admin/thong-bao/${notificationId}/mark-read`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]')?.content || ''
                    }
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            // Update badge count
                            const badge = document.getElementById('notificationBadge');
                            if (badge) {
                                if (data.unreadCount === 0) {
                                    badge.remove();
                                } else {
                                    badge.textContent = data.unreadCount;
                                }
                            }
                            // Navigate to application
                            if (applicationId) {
                                window.location.href = `/admin/don-dang-ky?highlight=${applicationId}`;
                            }
                        }
                    })
                    .catch(error => console.error('Error marking as read:', error));
            }

            function formatTime(dateString) {
                const date = new Date(dateString);
                const now = new Date();
                const diff = Math.floor((now - date) / 1000); // seconds

                if (diff < 60) return 'Vừa xong';
                if (diff < 3600) return Math.floor(diff / 60) + ' phút trước';
                if (diff < 86400) return Math.floor(diff / 3600) + ' giờ trước';
                if (diff < 604800) return Math.floor(diff / 86400) + ' ngày trước';

                return date.toLocaleDateString('vi-VN');
            }

            // Load notifications when dropdown is opened - using both events for compatibility
            document.addEventListener('DOMContentLoaded', function () {
                console.log('DOM loaded, setting up notification dropdown...');
                const dropdownButton = document.getElementById('notificationDropdown');

                if (dropdownButton) {
                    console.log('Notification dropdown button found!');

                    // Try Bootstrap 5 event
                    dropdownButton.addEventListener('show.bs.dropdown', function () {
                        console.log('Dropdown opening (Bootstrap event)...');
                        loadNotifications();
                    });

                    // Fallback to click event
                    dropdownButton.addEventListener('click', function () {
                        console.log('Dropdown clicked...');
                        setTimeout(loadNotifications, 100);
                    });
                } else {
                    console.error('Notification dropdown button NOT found!');
                }
            });
        </script>
    </nav>

</body>

</html>
