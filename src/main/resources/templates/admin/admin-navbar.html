<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="admin-navbar" class="admin-top-navbar" role="navigation" aria-label="Admin top navigation" style="background: white; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); padding: 1rem 2rem; border-bottom: 1px solid #e5e7eb;">
    <div class="container-fluid d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center">
            <!-- Nút Hamburger để mở Navigation Drawer (chỉ hiển thị trên mobile) -->
            <button class="btn btn-outline-secondary me-3 d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#adminNavigationDrawer" aria-controls="adminNavigationDrawer" aria-label="Toggle admin navigation" style="border-radius: 8px;">
                <i class="fas fa-bars"></i>
            </button>

            <!-- Breadcrumbs Navigation -->
            <nav aria-label="breadcrumb" class="mb-0">
                <ol class="breadcrumb mb-0" style="background: transparent; padding: 0; margin: 0;">
                    <li class="breadcrumb-item">
                        <a th:href="@{/admin/phong}" class="text-decoration-none d-flex align-items-center" style="color: #667eea; font-weight: 500; transition: color 0.2s;">
                            <i class="fas fa-home me-1"></i>Trang chủ
                        </a>
                    </li>
                    <li class="breadcrumb-item active d-flex align-items-center" aria-current="page" th:if="${pageTitle}">
                        <i class="fas fa-chevron-right me-2" style="font-size: 0.75rem; color: #9ca3af;"></i>
                        <span style="color: #2d3748; font-weight: 600;" th:text="${pageTitle}"></span>
                    </li>
                </ol>
            </nav>
        </div>

        <!-- Right side actions -->
        <div class="d-flex align-items-center gap-3">
            <!-- Notifications (optional) -->
            <button class="btn btn-link text-muted position-relative" type="button" aria-label="Thông báo" style="border: none; padding: 0.5rem;">
                <i class="fas fa-bell fs-5"></i>
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.65rem;">0</span>
            </button>

            <!-- User info -->
            <div class="d-flex align-items-center text-muted">
                <i class="fas fa-user-circle me-2 fs-5"></i>
                <span class="fw-semibold" style="color: #4a5568;" th:text="${admin?.hoTen ?: 'Admin'}">Admin</span>
            </div>
        </div>
    </div>
</nav>

<style>
    .admin-top-navbar {
        position: sticky;
        top: 0;
        z-index: 999;
        backdrop-filter: blur(10px);
    }

    .admin-top-navbar .btn-link:hover {
        color: #667eea !important;
        transform: scale(1.1);
    }

    .admin-top-navbar .breadcrumb-item a:hover {
        color: #5568d3 !important;
    }

    .admin-top-navbar .breadcrumb-item + .breadcrumb-item::before {
        content: none;
    }
</style>

</body>
</html>
