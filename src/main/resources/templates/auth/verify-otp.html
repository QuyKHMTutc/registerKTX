<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: header('Xác Thực OTP', 'Trang xác thực mã OTP.')}"></head>

<body>

<main id="main-content" class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-lg" style="width: 100%; max-width: 450px;">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="fas fa-shield-alt fa-3x text-primary"></i>
                <h1 class="h3 mt-3 mb-1">Xác Thực Tài Khoản</h1>
                <p class="text-muted">Vui lòng nhập mã OTP đã được gửi đến email của bạn.</p>
            </div>

            <!-- Info/Success/Error Messages -->
            <div th:if="${infoMessage}" class="alert alert-info" th:text="${infoMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/auth/verify}" th:object="${otpVerificationRequest}" method="post" novalidate>
                <input type="hidden" th:field="*{username}" />

                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username-display" th:value="*{username}" readonly>
                    <label for="username-display">Tài khoản</label>
                </div>

                <div class="form-floating mb-4">
                    <input type="text" class="form-control" id="otp" th:field="*{otp}" required autofocus
                           pattern="[0-9]{6}" title="Mã OTP phải là 6 chữ số." maxlength="6">
                    <label for="otp">Mã OTP</label>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('otp')}" th:errors="*{otp}"></div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="fas fa-check me-2"></i>Xác Nhận
                    </button>
                </div>
            </form>

            <hr class="my-4">

            <!-- Resend OTP Form -->
            <div class="text-center">
                <p class="text-muted mb-2">Không nhận được mã?</p>
                <form th:action="@{/auth/resend-otp}" method="post" class="d-inline">
                    <input type="hidden" name="username" th:value="${otpVerificationRequest.username}" />
                    <button type="submit" class="btn btn-link text-decoration-none">
                        <i class="fas fa-paper-plane me-1"></i>Gửi lại mã OTP
                    </button>
                </form>
            </div>
            
            <div class="text-center mt-3">
                <a th:href="@{/auth/login}" class="text-decoration-none">
                    <i class="fas fa-arrow-left me-1"></i>Quay lại trang đăng nhập
                </a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer-scripts}"></div>

</body>
</html>
