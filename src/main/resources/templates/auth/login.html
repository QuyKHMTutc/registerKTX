<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: header('Đăng Nhập - KTX', 'Trang đăng nhập vào hệ thống quản lý ký túc xá.')}"></head>

<body>
    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh; padding: 2rem 0;">
        <div class="row justify-content-center w-100">
            <div class="col-md-6 col-lg-4">
                <div class="card login-card shadow-lg">
                    <div class="card-header text-white text-center"
                        style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                        <i class="fas fa-sign-in-alt fa-2x mb-2"></i>
                        <h4 class="mb-0">Đăng Nhập KTX</h4>
                    </div>
                    <div class="card-body p-4">
                        <!-- THÔNG BÁO ĐỘNG -->
                        <!-- Thông báo thành công (từ redirect) -->
                        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show"
                            role="alert">
                            <i class="fas fa-check-circle me-2"></i>
                            <span th:text="${successMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        <!-- Thông báo lỗi (từ redirect) -->
                        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show"
                            role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            <span th:text="${errorMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <!-- Thông báo từ URL params (Spring Security) -->
                        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            Tên đăng nhập hoặc mật khẩu không đúng.
                        </div>
                        <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show"
                            role="alert">
                            <i class="fas fa-check-circle me-2"></i>
                            Bạn đã đăng xuất thành công.
                        </div>
                        <div th:if="${param.not_activated}" class="alert alert-warning alert-dismissible fade show"
                            role="alert">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            <span>Tài khoản chưa được kích hoạt.</span>
                            <a th:href="@{/auth/verify(username=${param.username})}" class="alert-link">Nhấn vào đây để
                                xác thực.</a>
                        </div>
                        <div th:if="${param.locked}" class="alert alert-danger alert-dismissible fade show"
                            role="alert">
                            <i class="fas fa-lock me-2"></i>
                            Tài khoản này đã bị khóa.
                        </div>


                        <form th:action="@{/auth/login}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <div class="mb-3">
                                <label for="tenDangNhap" class="form-label">
                                    <i class="fas fa-user me-2"></i>Tên Đăng Nhập
                                </label>
                                <input type="text" class="form-control" id="tenDangNhap" name="tenDangNhap"
                                    th:value="${param.username}" placeholder="Nhập tên đăng nhập" required autofocus
                                    tabindex="1">
                            </div>

                            <div class="mb-3">
                                <label for="matKhau" class="form-label">
                                    <i class="fas fa-lock me-2"></i>Mật Khẩu
                                </label>
                                <div class="password-input-container">
                                    <input type="password" class="form-control" id="matKhau" name="matKhau"
                                        placeholder="Nhập mật khẩu" required tabindex="2">
                                    <button class="btn btn-link password-toggle" type="button" id="togglePassword"
                                        tabindex="-1">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg" tabindex="3">
                                    <i class="fas fa-sign-in-alt me-2"></i>Đăng Nhập
                                </button>
                            </div>
                        </form>

                        <hr class="my-4">

                        <div class="text-center">
                            <p class="mb-2 text-muted">Chưa có tài khoản?</p>
                            <a th:href="@{/auth/register}" class="btn btn-outline-primary" tabindex="4">
                                <i class="fas fa-user-plus me-2"></i>Đăng Ký Ngay
                            </a>
                        </div>
                        <div class="text-center mt-3">
                            <a th:href="@{/auth/forgot-password}" class="text-decoration-none" tabindex="5">
                                <i class="fas fa-question-circle me-2"></i>Quên mật khẩu?
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            function setupPasswordToggle(inputId, toggleId) {
                const passwordInput = document.getElementById(inputId);
                const toggleButton = document.getElementById(toggleId);

                if (passwordInput && toggleButton) {
                    toggleButton.addEventListener('click', function () {
                        const icon = this.querySelector('i');
                        if (passwordInput.type === 'password') {
                            passwordInput.type = 'text';
                            icon.classList.remove('fa-eye');
                            icon.classList.add('fa-eye-slash');
                        } else {
                            passwordInput.type = 'password';
                            icon.classList.remove('fa-eye-slash');
                            icon.classList.add('fa-eye');
                        }
                    });
                }
            }
            setupPasswordToggle('matKhau', 'togglePassword');
        });
    </script>
    <style>
        .password-input-container {
            position: relative;
        }

        .password-input-container .form-control {
            padding-right: 3rem;
            /* Make space for the toggle button */
        }

        .password-toggle {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            padding: 0.375rem 0.75rem;
            cursor: pointer;
            color: #6c757d;
            /* Bootstrap secondary color */
            border: none;
            background: transparent;
            z-index: 100;
            /* Ensure it's above the input */
            /* Loại bỏ hiệu ứng nhảy */
            outline: none !important;
            box-shadow: none !important;
            transition: none !important;
            /* Tắt mọi transition */
        }

        .password-toggle:hover {
            color: #000;
            /* Đảm bảo không có thay đổi về kích thước hoặc vị trí khi hover */
            transform: translateY(-50%) scale(1);
            /* Giữ nguyên scale */
        }

        .password-toggle:active {
            transform: translateY(-50%) scale(1);
            /* Giữ nguyên scale khi click */
        }
    </style>
</body>

</html>
