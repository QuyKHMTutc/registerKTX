<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: header('Quên Mật Khẩu', 'Trang yêu cầu đặt lại mật khẩu.')}"></head>

<body>

<main id="main-content" class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-lg" style="width: 100%; max-width: 450px;">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="fas fa-question-circle fa-3x text-warning"></i>
                <h1 class="h3 mt-3 mb-1">Quên Mật Khẩu?</h1>
                <p class="text-muted">Nhập địa chỉ email của bạn để nhận mã OTP đặt lại mật khẩu.</p>
            </div>

            <!-- Success Message -->
            <div th:if="${successMessage}" class="alert alert-success" role="alert">
                <i class="fas fa-check-circle me-2"></i>
                <span th:text="${successMessage}"></span>
            </div>

            <!-- Error Message -->
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/auth/forgot-password}" th:object="${forgotPasswordRequest}" method="post" novalidate>
                <div class="form-floating mb-4">
                    <input type="email" class="form-control" id="email" th:field="*{email}" required autofocus
                           placeholder="Nhập email của bạn">
                    <label for="email">Địa chỉ Email</label>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-warning btn-lg">
                        <i class="fas fa-paper-plane me-2"></i>Gửi Mã OTP
                    </button>
                </div>
            </form>

            <div class="text-center mt-4">
                <a th:href="@{/auth/login}" class="text-decoration-none">
                    <i class="fas fa-arrow-left me-1"></i>Quay lại trang đăng nhập
                </a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer-scripts}"></div>

</body>
</html>
