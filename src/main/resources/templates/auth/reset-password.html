<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: header('Đặt Lại Mật Khẩu', 'Trang đặt lại mật khẩu.')}"></head>

<body>

<main id="main-content" class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-lg" style="width: 100%; max-width: 450px;">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="fas fa-key fa-3x text-success"></i>
                <h1 class="h3 mt-3 mb-1">Đặt Lại Mật Khẩu</h1>
                <p class="text-muted">Nhập mã OTP và mật khẩu mới của bạn.</p>
            </div>

            <!-- Success Message -->
            <div th:if="${successMessage}" class="alert alert-success" role="alert">
                <i class="fas fa-check-circle me-2"></i>
                <span th:text="${successMessage}"></span>
            </div>

            <!-- Error Message -->
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/auth/reset-password}" th:object="${resetPasswordRequest}" method="post" novalidate>
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username-display" th:field="*{username}" readonly>
                    <label for="username-display">Tên đăng nhập</label>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>

                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="otp" th:field="*{otp}" required
                           pattern="[0-9]{6}" title="Mã OTP phải là 6 chữ số." maxlength="6">
                    <label for="otp">Mã OTP</label>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('otp')}" th:errors="*{otp}"></div>
                </div>

                <div class="mb-3">
                    <label for="newPassword" class="form-label">
                        <i class="fas fa-lock me-2"></i>Mật khẩu mới
                    </label>
                    <div class="password-input-container">
                        <input type="password" class="form-control" id="newPassword" th:field="*{newPassword}" required
                               minlength="6" placeholder="Mật khẩu mới">
                        <button class="btn btn-link password-toggle" type="button" id="toggleNewPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="confirmPassword" class="form-label">
                        <i class="fas fa-lock me-2"></i>Xác nhận mật khẩu mới
                    </label>
                    <div class="password-input-container">
                        <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" required
                               minlength="6" placeholder="Xác nhận mật khẩu mới">
                        <button class="btn btn-link password-toggle" type="button" id="toggleConfirmNewPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-success btn-lg">
                        <i class="fas fa-check-circle me-2"></i>Đặt Lại Mật Khẩu
                    </button>
                </div>
            </form>

            <div class="text-center mt-4">
                <a th:href="@{/auth/login}" class="text-decoration-none">
                    <i class="fas fa-arrow-left me-1"></i>Quay lại trang đăng nhập
                </a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer-scripts}"></div>

<script>
    function setupPasswordToggle(inputId, toggleId) {
        const passwordInput = document.getElementById(inputId);
        const toggleButton = document.getElementById(toggleId);

        if (passwordInput && toggleButton) {
            toggleButton.addEventListener('click', function () {
                const icon = this.querySelector('i');
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    passwordInput.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        setupPasswordToggle('newPassword', 'toggleNewPassword');
        setupPasswordToggle('confirmPassword', 'toggleConfirmNewPassword');
    });
</script>
<style>
    .password-input-container {
        position: relative;
    }
    .password-input-container .form-control {
        padding-right: 3rem; /* Make space for the toggle button */
    }
    .password-toggle {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        padding: 0.375rem 0.75rem;
        cursor: pointer;
        color: #6c757d; /* Bootstrap secondary color */
        border: none;
        background: transparent;
        z-index: 100; /* Ensure it's above the input */
        /* Loại bỏ hiệu ứng nhảy */
        outline: none !important;
        box-shadow: none !important;
        transition: none !important; /* Tắt mọi transition */
    }
    .password-toggle:hover {
        color: #000;
        /* Đảm bảo không có thay đổi về kích thước hoặc vị trí khi hover */
        transform: translateY(-50%) scale(1); /* Giữ nguyên scale */
    }
    .password-toggle:active {
        transform: translateY(-50%) scale(1); /* Giữ nguyên scale khi click */
    }
</style>
</body>
</html>
