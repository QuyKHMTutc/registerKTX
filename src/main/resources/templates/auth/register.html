<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head
    th:replace="~{fragments :: header('Đăng Ký - KTX', 'Trang đăng ký tài khoản mới cho hệ thống quản lý ký túc xá.')}">
</head>

<body>
    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh; padding: 2rem 0;">
        <div class="row justify-content-center w-100">
            <div class="col-md-8 col-lg-6">
                <div class="card register-card shadow-lg">
                    <div class="card-header text-white text-center"
                        style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                        <i class="fas fa-user-plus fa-2x mb-2"></i>
                        <h4 class="mb-0">Đăng Ký Tài Khoản KTX</h4>
                    </div>
                    <div class="card-body p-4">
                        <!-- Thông báo -->
                        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show"
                            role="alert">
                            <i class="fas fa-check-circle me-2"></i>
                            <span th:text="${successMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show"
                            role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            <span th:text="${errorMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <!-- Ẩn form nếu đăng ký thành công -->
                        <div th:if="${showSuccess == null || !showSuccess}">
                            <form th:action="@{/auth/register}" th:object="${registerRequest}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                                <div class="mb-3">
                                    <label for="username" class="form-label">
                                        <i class="fas fa-user me-2"></i>Tên đăng nhập <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" class="form-control" id="username" th:field="*{username}"
                                        th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                                        placeholder="Nhập tên đăng nhập của bạn" required autofocus tabindex="1">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}"
                                        th:errors="*{username}"></div>
                                    <div class="form-text">Tên đăng nhập phải là duy nhất và từ 3 đến 50 ký tự.</div>
                                </div>

                                <!-- Đã bỏ trường Họ Tên -->

                                <div class="mb-3">
                                    <label for="email" class="form-label">
                                        <i class="fas fa-envelope me-2"></i>Email <span class="text-danger">*</span>
                                    </label>
                                    <input type="email" class="form-control" id="email" th:field="*{email}"
                                        th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                        placeholder="Nhập địa chỉ email của bạn" required tabindex="2">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                                        th:errors="*{email}"></div>
                                    <div class="form-text">Email sẽ được dùng để gửi mã xác thực.</div>
                                </div>

                                <div class="mb-3">
                                    <label for="matKhau" class="form-label">
                                        <i class="fas fa-lock me-2"></i>Mật Khẩu <span class="text-danger">*</span>
                                    </label>
                                    <div class="password-input-container">
                                        <input type="password" class="form-control" id="matKhau" th:field="*{matKhau}"
                                            th:classappend="${#fields.hasErrors('matKhau')} ? 'is-invalid' : ''"
                                            placeholder="Nhập mật khẩu (tối thiểu 6 ký tự)" required minlength="6"
                                            tabindex="3">
                                        <button class="btn btn-link password-toggle" type="button"
                                            id="togglePasswordRegister" tabindex="-1">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('matKhau')}"
                                            th:errors="*{matKhau}"></div>
                                    </div>
                                    <div class="form-text">
                                        <div id="passwordStrength" class="mt-2">
                                            <div class="progress" style="height: 5px;">
                                                <div id="strengthBar" class="progress-bar" role="progressbar"
                                                    style="width: 0%"></div>
                                            </div>
                                            <small id="strengthText" class="text-muted"></small>
                                        </div>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="xacNhanMatKhau" class="form-label">
                                        <i class="fas fa-lock me-2"></i>Xác Nhận Mật Khẩu <span
                                            class="text-danger">*</span>
                                    </label>
                                    <div class="password-input-container">
                                        <input type="password" class="form-control" id="xacNhanMatKhau"
                                            th:field="*{xacNhanMatKhau}"
                                            th:classappend="${#fields.hasErrors('xacNhanMatKhau')} ? 'is-invalid' : ''"
                                            placeholder="Nhập lại mật khẩu" required minlength="6" tabindex="4">
                                        <button class="btn btn-link password-toggle" type="button"
                                            id="toggleConfirmPasswordRegister" tabindex="-1">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('xacNhanMatKhau')}"
                                            th:errors="*{xacNhanMatKhau}"></div>
                                    </div>
                                </div>

                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-primary btn-lg" tabindex="5">
                                        <i class="fas fa-user-plus me-2"></i>Đăng Ký
                                    </button>
                                </div>
                            </form>
                        </div>

                        <!-- Hiển thị nút đăng nhập nếu đăng ký thành công -->
                        <div th:if="${showSuccess}" class="text-center mt-3">
                            <a th:href="@{/auth/login}" class="btn btn-primary btn-lg">Đăng Nhập Ngay</a>
                        </div>

                        <hr class="my-4">

                        <div class="text-center">
                            <p class="mb-0">Đã có tài khoản?</p>
                            <a th:href="@{/auth/login}" class="btn btn-outline-primary" tabindex="6">Đăng Nhập</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Password strength indicator
        const matKhauInput = document.getElementById('matKhau');
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');

        matKhauInput.addEventListener('input', function () {
            const password = this.value;
            const strength = calculatePasswordStrength(password);

            strengthBar.style.width = strength.percentage + '%';
            strengthBar.className = 'progress-bar ' + strength.class;
            strengthText.textContent = strength.text;
            strengthText.className = strength.textClass;
        });

        function calculatePasswordStrength(password) {
            let strength = 0;
            let feedback = [];

            if (password.length >= 6) strength += 20;
            else feedback.push('Tối thiểu 6 ký tự');

            if (password.length >= 8) strength += 10;
            if (/[a-z]/.test(password)) strength += 15;
            if (/[A-Z]/.test(password)) strength += 15;
            if (/[0-9]/.test(password)) strength += 15;
            if (/[^A-Za-z0-9]/.test(password)) strength += 25;

            if (strength < 30) {
                return {
                    percentage: strength,
                    class: 'bg-danger',
                    text: 'Mật khẩu yếu',
                    textClass: 'text-danger'
                };
            } else if (strength < 60) {
                return {
                    percentage: strength,
                    class: 'bg-warning',
                    text: 'Mật khẩu trung bình',
                    textClass: 'text-warning'
                };
            } else if (strength < 80) {
                return {
                    percentage: strength,
                    class: 'bg-info',
                    text: 'Mật khẩu khá',
                    textClass: 'text-info'
                };
            } else {
                return {
                    percentage: strength,
                    class: 'bg-success',
                    text: 'Mật khẩu mạnh',
                    textClass: 'text-success'
                };
            }
        }

        // Kiểm tra mật khẩu xác nhận với real-time feedback
        const xacNhanInput = document.getElementById('xacNhanMatKhau');
        xacNhanInput.addEventListener('input', function () {
            const matKhau = matKhauInput.value;
            const xacNhan = this.value;

            if (xacNhan.length === 0) {
                this.setCustomValidity('');
                this.classList.remove('is-invalid', 'is-valid');
                return;
            }

            if (matKhau !== xacNhan) {
                this.setCustomValidity('Mật khẩu xác nhận không khớp');
                this.classList.add('is-invalid');
                this.classList.remove('is-valid');
            } else {
                this.setCustomValidity('');
                this.classList.add('is-valid');
                this.classList.remove('is-invalid');
            }
        });

        // Real-time validation for email
        const emailInput = document.getElementById('email');
        emailInput.addEventListener('blur', function () {
            const value = this.value.trim();
            if (!value.includes('@')) { // Simple check for email format
                this.setCustomValidity('Vui lòng nhập địa chỉ email hợp lệ');
                this.classList.add('is-invalid');
            } else {
                this.setCustomValidity('');
                this.classList.remove('is-invalid');
                this.classList.add('is-valid');
            }
        });

        // Toggle password visibility
        function setupPasswordToggle(inputId, toggleId) {
            const passwordInput = document.getElementById(inputId);
            const toggleButton = document.getElementById(toggleId);

            if (passwordInput && toggleButton) {
                toggleButton.addEventListener('click', function () {
                    const icon = this.querySelector('i');
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        icon.classList.remove('fa-eye');
                        icon.classList.add('fa-eye-slash');
                    } else {
                        passwordInput.type = 'password';
                        icon.classList.remove('fa-eye-slash');
                        icon.classList.add('fa-eye');
                    }
                });
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            setupPasswordToggle('matKhau', 'togglePasswordRegister');
            setupPasswordToggle('xacNhanMatKhau', 'toggleConfirmPasswordRegister');
        });
    </script>
    <style>
        .password-input-container {
            position: relative;
        }

        .password-input-container .form-control {
            padding-right: 3rem;
            /* Make space for the toggle button */
        }

        .password-toggle {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            padding: 0.375rem 0.75rem;
            cursor: pointer;
            color: #6c757d;
            /* Bootstrap secondary color */
            border: none;
            background: transparent;
            z-index: 100;
            /* Ensure it's above the input */
            /* Loại bỏ hiệu ứng nhảy */
            outline: none !important;
            box-shadow: none !important;
            transition: none !important;
            /* Tắt mọi transition */
        }

        .password-toggle:hover {
            color: #000;
            /* Đảm bảo không có thay đổi về kích thước hoặc vị trí khi hover */
            transform: translateY(-50%) scale(1);
            /* Giữ nguyên scale */
        }

        .password-toggle:active {
            transform: translateY(-50%) scale(1);
            /* Giữ nguyên scale khi click */
        }
    </style>
</body>

</html>
